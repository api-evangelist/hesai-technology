aid: hesai-technology
name: Hesai Technology
description: >-
  Hesai Technology is a global leader in 3D LiDAR perception, designing and manufacturing
  high-performance lidar sensors for autonomous driving, advanced driver-assistance systems
  (ADAS), robotics, and industrial automation. Its sensors are deployed by major automotive
  OEMs and autonomous-vehicle companies across more than 40 countries. Hesai does not expose
  a public REST/HTTP API; its developer surface is source-distributed C++ SDKs, ROS and ROS2
  drivers, and integration plugins (including an NVIDIA DriveWorks plugin) published on the
  HesaiTechnology GitHub organization, alongside a developer portal and downloadable firmware,
  manuals, and tools. This profile was surfaced as a portfolio company of Qiming and enriched
  by the API Evangelist pipeline from Hesai's public developer resources.
